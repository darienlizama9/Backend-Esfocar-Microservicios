# ==============================================================================
# CONFIGURACIÓN DEL SERVIDOR WEB (RENDER & LOCAL)
# ==============================================================================
server.port=${PORT:8080}

# ==============================================================================
# CONEXIÓN A POSTGRESQL (NEON SERVERLESS)
# ==============================================================================
# Define estas variables en Render (Environment) o en tu entorno local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# POOL DE CONEXIONES HIKARICP OPTIMIZADO PARA NEON SERVERLESS
# ==============================================================================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==============================================================================
# HIBERNATE / JPA
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ==============================================================================
# SWAGGER / OPENAPI (DOCUMENTACIÓN DE API)
# ==============================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs